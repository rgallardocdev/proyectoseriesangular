<p>{{mensajeParametro}}</p>

@if(_miSerie){

    <!-- Cabecera de la sección -->
    <div class="mb-4">
        <h4 class="fw-bold">{{arraySaludo[2]}}</h4>
    </div>    

    <div class="card shadow-sm h-100" style="width: 18rem;">
        <!-- Imagen de la serie -->
        <img onerror="this.onerror=null; this.src='imagenes/imagen-por-defecto.avif';" [src]="_miSerie.imagen" class="card-img-top object-fit-cover" [alt]="_miSerie.nombre" style="height: 250px;">
        
        <div class="card-body d-flex flex-column">
            <!-- Título y Año -->
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="card-title mb-0">{{ _miSerie.nombre }}</h5>
                <span class="badge text-bg-secondary">{{ _miSerie.anyo }}</span>
            </div>

            <!-- ID de referencia (opcional) -->
            <p class="card-text text-body-secondary small mb-3">
            ID: #{{ _miSerie.idSerie }}
            </p> 

            <!-- Botón de acción empujado al fondo -->
            <div class="mt-auto">
                <a [routerLink]="['/personaje/', _miSerie.idSerie]" class="btn btn-primary w-100">
                    Ver Personajes de la serie
                </a>
            </div>
        </div>
    </div>    
}
