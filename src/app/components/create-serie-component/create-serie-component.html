<div class="container mt-5" style="max-width: 550px;">
  <div class="card border-4 shadow-sm rounded-4">
    <div class="card-body p-4 p-md-5">
      <h4 class="card-title mb-4 fw-bold text-primary">Nueva Serie</h4>

      <form #form="ngForm">
        <!-- ID oculto para cumplir con la estructura del modelo al insertar -->
        <input type="hidden" id="idSerie" name="cajaidserie" #cajaidserie value="0">

        <!-- Campo: nombre -->
        <div class="form-floating mb-3">
          <input 
            type="text" 
            class="form-control border-4 bg-light rounded-3" 
            id="nombre" 
            name="cajanombre" 
            #cajanombre
            placeholder="Nombre de la Serie" 
            required>
          <label for="nombre" class="text-muted">Nombre de la Serie</label>
          <div class="invalid-feedback">
            Por favor, introduce un nombre.
          </div>
        </div>

        <!-- Campo: imagen (URL) -->
        <!-- <div class="form-floating mb-3">
          <input 
            type="url" 
            class="form-control border-0 bg-light rounded-3" 
            id="imagen" 
            name="imagen" 
            placeholder="https://ejemplo.com" 
            required>
          <label for="imagen" class="text-muted">URL de la imagen</label>
          <div class="invalid-feedback">
            Introduce una URL válida para la imagen.
          </div>
        </div> -->
        <div class="mb-3">
        <label for="inputImagen" class="form-label text-muted small fw-semibold mb-2">
            Imagen de la Serie
        </label>
        <div class="d-flex align-items-center gap-3 p-3 bg-light rounded-3">
            <!-- Botón de selección personalizado -->
            <div class="flex-grow-1">
            <label for="inputImagen" class="btn btn-outline-primary btn-sm rounded-3 mb-1 fw-medium">
                Seleccionar archivo
            </label>
            <input 
                type="file" 
                class="d-none" 
                id="inputImagen" 
                name="cajaimagen"
                #cajaimagen
                (change)="onFileSelected($event)"
                accept="image/*" 
                required>
            
            <div class="text-muted small text-truncate" style="max-width: 250px;">
                {{ nombreArchivo || 'Ningún archivo seleccionado' }}
            </div>
            </div>
        </div>
        <!-- Campo: anyo -->
        <div class="form-floating mb-3">
          <input 
            type="text" 
            class="form-control border-4 bg-light rounded-3" 
            id="anyo" 
            name="cajaanyo" 
            #cajaanyo
            placeholder="Año de la Serie" 
            required>
          <label for="anyo" class="text-muted">Año de la Serie</label>
          <div class="invalid-feedback">
            Por favor, introduce un año.
          </div>
        </div>

        </div>
        <br><br>
        <!-- Botones de acción -->
        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button type="reset" class="btn btn-light rounded-3 px-4">Limpiar</button>
          <button (click)="createSerie()" type="submit" class="btn btn-primary rounded-3 px-4 fw-semibold">
            Guardar Serie
          </button>
        </div>
      </form>
      <br><br>
      <p>{{mensajeProceso}}</p>
    </div>
  </div>
</div>
